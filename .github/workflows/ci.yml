name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wewin
          POSTGRES_PASSWORD: wewin
          POSTGRES_DB: wewin_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wewin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wewin:wewin@localhost:5432/wewin_erp_test
      TEST_DATABASE_URL: postgresql://wewin:wewin@localhost:5432/wewin_erp_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CORS_ORIGIN: http://localhost:5173
      TZ: Asia/Kolkata
      FY_START_MONTH: '4'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Migrate test database
        run: pnpm db:deploy
      - name: Unit + API tests
        run: pnpm test
      - name: Build
        run: pnpm build
