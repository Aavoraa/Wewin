services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wewin
      POSTGRES_PASSWORD: wewin
      POSTGRES_DB: wewin_erp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
volumes:
  pgdata:
