# Wewin ERP — Nginx site (production / staging). Replace erp.example.in with the real host name.
# TLS certificates: certbot --nginx -d erp.example.in  (Let's Encrypt, auto-renew timer).

upstream wewin_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name erp.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.example.in;

    ssl_certificate     /etc/letsencrypt/live/erp.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads (attachments 10 MB, scans and opening data a little more) — keep in step with the API limits.
    client_max_body_size 25m;

    # React build (apps/web/dist). Hashed assets cache for a year; index.html never.
    root /srv/wewin/current/apps/web/dist;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://wewin_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s; # OCR of long scanned invoices
    }
}
